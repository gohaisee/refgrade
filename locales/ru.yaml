check.rest-07.why: "детали ошибки утекают клиенту"
check.rest-07.fix: "безопасные коды в ответе; детали в лог на сервере"
check.rest-08.when: "gin.SetMode(DebugMode) вне dev-сборки"
check.rest-08.why: "debug mode может отдавать stack trace клиентам"
check.rest-08.fix: "release mode из env в production"
check.rest-09.when: "gorilla/mux в go.mod без заметки о миграции"
check.rest-09.why: "gorilla/mux не рекомендуется для новых сервисов"
check.rest-09.fix: "мигрировать на chi или stdlib 1.22+ routes"
check.rest-10.when: "запуск http-сервера без recover middleware"
check.rest-10.why: "panic в handler может уронить процесс"
check.rest-10.fix: "recover middleware на внешнем крае"
check.sql-01.when: "Query/Exec/вызов orm внутри for"
check.sql-01.why: "запрос в цикле по спискам тянет строки по одной"
check.sql-01.fix: "batch через WHERE id = ANY($1) или join"
check.sql-02.when: "sql собран через fmt.Sprintf с пользовательским вводом"
check.sql-02.why: "строковый sql открывает инъекцию"
check.sql-02.fix: "только параметризованные запросы"
check.sql-03.when: "функция List*/FindAll* без LIMIT в sql"
check.sql-03.why: "список может просканировать всю таблицу"
check.sql-03.fix: "жёсткий LIMIT; keyset pagination"
check.sql-04.when: "SELECT * в sql-строке"
check.sql-04.why: "лишние колонки в выборке"
check.sql-04.fix: "перечислить колонки явно"
check.sql-05.when: "новый pool или соединение внутри handler"
check.sql-05.why: "pool на запрос исчерпывает fd"
check.sql-05.fix: "один общий pool на процесс"
check.sql-06.when: "поле float64 с денежным именем"
check.sql-06.why: "округление float ломает деньги"
check.sql-06.fix: "целые минорные единицы или decimal type"
check.sql-07.when: "OFFSET в sql-строке или комментарии"
check.sql-07.why: "offset-страницы тормозят на больших таблицах"
check.sql-07.fix: "keyset pagination (WHERE id > $cursor)"
check.pgx-01.when: "pgx.Connect в коде приложения"
check.pgx-01.why: "одно соединение не обслуживает конкурентные запросы"
check.pgx-01.fix: "использовать pgxpool.New"
check.pgx-02.when: "ошибка postgres сравнивается по строке"
check.pgx-02.why: "текст сообщения меняется между версиями сервера"
check.pgx-02.fix: "коды SQLSTATE через pgconn.PgError"
check.pgx-03.when: "sslmode=disable в удалённом dsn"
check.pgx-03.why: "учётные данные идут в открытом виде по сети"
check.pgx-03.fix: "включить tls для удалённых хостов"
check.gorm-01.when: "db.Raw со склейкой строк"
check.gorm-01.why: "склеенный sql открывает инъекцию"
check.gorm-01.fix: "bind parameters через ?"
check.gorm-02.when: "глубокая цепочка Preload на list endpoint"
check.gorm-02.why: "вложенные preload дают много запросов на строку"
check.gorm-02.fix: "join или batch load"
check.gorm-03.when: "AutoMigrate в cmd main"
check.gorm-03.why: "схема в prod должна идти через версионные миграции"
check.gorm-03.fix: "goose или golang-migrate"
check.gorm-04.when: "Debug() вне тестов"
check.gorm-04.why: "debug пишет каждый sql в лог"
check.gorm-04.fix: "убрать Debug() из prod-путей"
check.gorm-05.when: "package-level var DB *gorm.DB"
check.gorm-05.why: "глобальный db скрывает зависимости и гонки в тестах"
check.gorm-05.fix: "внедрять *gorm.DB через конструктор"
check.sqlx-01.when: "sqlx Get/Select без context-формы"
check.sqlx-01.why: "вызов нельзя отменить при отключении клиента"
check.sqlx-01.fix: "GetContext/SelectContext с ctx запроса"
check.sqlc-01.when: "ручное редактирование *.sql.go"
check.sqlc-01.why: "правки потеряются при следующем sqlc generate"
check.sqlc-01.fix: "менять queries.sql и регенерировать"
check.ent-01.when: "обход edge внутри for"
check.ent-01.why: "ленивые edges дают запрос на итерацию"
check.ent-01.fix: "eager-load edges или batch query"
check.grpc-01.when: "grpc.Dial или insecure credentials вне тестов"
check.grpc-01.why: "трафик можно перехватить по сети"
check.grpc-01.fix: "использовать tls или credentials.NewClientTLSFromCert"
check.grpc-02.when: "grpc.NewServer без unary или stream interceptors"
check.grpc-02.why: "нет общего auth, логирования и recovery на rpc-границе"
check.grpc-02.fix: "цепочка unary и stream interceptors на сервере"
check.grpc-03.when: "rpc handler больше 50 строк с inline sql"
check.grpc-03.why: "бизнес- и storage-логика в транспортном слое"
check.grpc-03.fix: "перенести sql в service или repo; handler тонкий"
check.grpc-04.when: "metadata x-user-id доверяется для авторизации"
check.grpc-04.why: "клиент может подделать metadata без валидного токена"
check.grpc-04.fix: "валидировать jwt и брать identity из подписанных claims"
check.grpc-05.when: "grpc reflection на публичном listener"
check.grpc-05.why: "поверхность rpc доступна без аутентификации"
