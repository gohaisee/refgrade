detect.none: "известные библиотеки стека не найдены"
check.cfg-01.when: "os.Getenv вне cmd/, тестов и integration/e2e сборок"
check.cfg-01.why: "env размазан по коду; сложно тестировать и ротировать секреты"
check.cfg-01.fix: "загружать в internal/config; инжектить struct в main"
check.cfg-02.when: "больше 3 getenv без пакета internal/config"
check.cfg-02.why: "магические строки ключей env по пакетам"
check.cfg-02.fix: "добавить internal/config со struct и валидацией"
check.cfg-03.when: "паттерны секретов в исходниках"
check.cfg-03.why: "утечка учётных данных через git"
check.cfg-03.fix: "env или secret manager; не коммитить значения"
check.cfg-04.when: "jwt signing key — пустой строковый литерал"
check.cfg-04.why: "авторизацию можно обойти с пустым секретом"
check.cfg-04.fix: "падать при старте если секрет не задан"
check.lay-01.when: "приложение без cmd/<name>/main.go"
check.lay-01.why: "неочевидная точка входа"
check.lay-01.fix: "перенести main в cmd/<app>/main.go"
check.lay-02.when: "бизнес-пакеты вне internal/ без причины pkg/"
check.lay-02.why: "случайный публичный API"
check.lay-02.fix: "держать код приложения в internal/"
check.lay-03.when: "module path в go.mod похож на заглушку"
check.lay-03.why: "путаница с импортами"
check.lay-03.fix: "указать реальный путь модуля из VCS"
check.lyr-01.when: "service импортирует db driver или ORM"
check.lyr-01.why: "бизнес-логика привязана к хранилищу"
check.lyr-01.fix: "repo/store пакет; интерфейс в service"
check.lyr-02.when: "handler импортирует internal/repo напрямую"
check.lyr-02.why: "транспорт знает детали SQL"
check.lyr-02.fix: "вызывать только service из handlers"
check.lyr-03.when: "New* или Init открывает сеть или БД"
check.lyr-03.why: "скрытые side effects ломают unit-тесты"
check.lyr-03.fix: "подключения только в main"
check.lyr-04.when: "package-level var db в service или handler"
check.lyr-04.why: "скрытое глобальное состояние"
check.lyr-04.fix: "инжектить зависимости через struct"
check.err-01.when: "_ = err или пустой if err != nil {}"
check.err-01.why: "ошибка теряется; сбои незаметны в проде"
check.err-01.fix: "вернуть обёрнутую ошибку, залогировать или обработать"
check.err-02.when: "panic в internal/ вне main и тестов"
check.err-02.why: "падение процесса на восстановимых ошибках"
check.err-02.fix: "return error; recover только на границе транспорта"
check.err-03.when: "http.DefaultClient или http.Get/http.Post без своего клиента"
check.err-03.why: "нет таймаута; исходящий вызов может зависнуть"
check.err-03.fix: "http.Client{Timeout: ...} и context запроса"
check.err-04.when: "http.Client с нулевым или без Timeout"
check.err-04.why: "тот же риск зависания что у DefaultClient"
check.err-04.fix: "задать Client.Timeout и дедлайны transport"
check.err-05.when: "context.Background в handler вместо контекста запроса"
check.err-05.why: "работа продолжается после отключения клиента"
check.err-05.fix: "использовать r.Context() или контекст stream"
check.err-06.when: "go func внутри for без лимита воркеров"
check.err-06.why: "шторм горутин под нагрузкой"
check.err-06.fix: "семафор или пул воркеров"
check.tst-01.when: "файл логики без парного _test.go"
check.tst-01.why: "регрессии остаются незамеченными"
check.tst-01.fix: "добавить table-driven тест рядом с кодом"
check.tst-02.when: "один all_test.go на весь пакет"
check.tst-02.why: "сложно найти упавший кейс"
check.tst-02.fix: "разбить тесты 1:1 с исходниками"
check.tst-03.when: "t.Skip без build tag в обычном CI"
check.tst-03.why: "сломанные тесты скрыты"
check.tst-03.fix: "починить тест или //go:build integration"
check.obs-01.when: "fmt.Print* в internal/"
check.obs-01.why: "неструктурированные логи теряются в проде"
check.obs-01.fix: "slog, zap или zerolog"
check.obs-02.when: "в лог попадают password, token или otp"
check.obs-02.why: "учётные данные в хранилище логов"
check.obs-02.fix: "редактировать поля; логировать только id"
check.con-01.when: "send в channel в handler без политики backpressure"
check.con-01.why: "память растёт при медленных потребителях"
check.con-01.fix: "ограниченный буфер и политика drop/block"
check.dead-01.when: "недостижимая функция по deadcode"
check.dead-01.why: "мёртвый код усложняет сопровождение"
check.dead-01.fix: "удалить или вызвать из entrypoints"
check.dead-06.when: "go mod tidy изменит go.mod"
check.dead-06.why: "неиспользуемые зависимости раздувают сборку"
check.dead-06.fix: "выполнить go mod tidy и закоммитить"
check.sec-16.when: "govulncheck нашёл известную уязвимость"
check.sec-16.why: "у зависимости есть опубликованный CVE"
check.sec-16.fix: "обновить модуль до патченной версии"
explain.title: "проверка"
explain.when: "когда"
explain.why: "почему"
explain.fix: "как исправить"
explain.unknown: "неизвестная проверка"
check.gql-01.when: "импорт sql/db driver в пакете resolver"
check.gql-01.why: "resolver ходит в хранилище напрямую"
check.gql-01.fix: "делегировать в service или repo"
check.gql-02.when: "запрос к бд внутри for в resolver"
check.gql-02.why: "медленные списки; запрос в цикле"
check.gql-02.fix: "dataloader, join в repo или sql batch"
check.gql-03.when: "ручное редактирование generated.go или models_gen.go"
check.gql-03.why: "gqlgen перезапишет правки при regen"
check.gql-03.fix: "менять schema и запускать gqlgen generate"
check.gql-04.when: "нет лимита complexity или depth в настройке сервера"
check.gql-04.why: "дорогой query может положить сервер"
check.gql-04.fix: "расширение gqlgen или кастомный middleware"
check.gql-05.when: "introspection включена без env gate"
check.gql-05.why: "дамп схемы доступен в проде"
check.gql-05.fix: "отключить introspection или закрыть auth"
check.gql-06.when: "маршрут graphiql или playground без dev gate"
check.gql-06.why: "публичный UI схемы в проде"
check.gql-06.fix: "build tag или маршрут только для dev"
check.gql-07.when: "map[string]interface{} в рукописных resolvers"
check.gql-07.why: "потеря типобезопасности на границе resolver"
check.gql-07.fix: "использовать сгенерированные models gqlgen"
check.gql-08.when: "файл resolver больше 500 строк"
check.gql-08.why: "большой resolver сложно ревьюить"
check.gql-08.fix: "разбить по домену или тонкие делегаты"
check.gql-09.when: "get-based graphql queries без лимита размера"
check.gql-09.why: "слишком длинные url и риск отравления кэша"
check.gql-09.fix: "только post endpoint или лимит query string"
check.gqlgen-01.when: "нет gqlgen.yml в gqlgen проекте"
check.gqlgen-01.why: "конфиг generate не закреплён для ci"
check.gqlgen-01.fix: "добавить gqlgen.yml и pin generate в ci"
check.gqlgen-02.when: "federation entity resolver без auth на id"
check.gqlgen-02.why: "поиск entity может пропустить ownership"
check.gqlgen-02.fix: "проверять что actor владеет entity"
check.ggl-01.when: "нет panic recovery на границе graphql execute"
check.ggl-01.why: "panic в resolver обрывает запрос"
check.ggl-01.fix: "обернуть executor recover middleware"
check.ggl-02.when: "только legacy graphql-go/graphql"
check.ggl-02.why: "code-first стек без tooling gqlgen"
check.ggl-02.fix: "для нового graphql рассмотреть gqlgen"
check.rest-01.when: "функция handler >80 строк без вызовов service"
check.rest-01.why: "бизнес-логика в транспортном слое"
check.rest-01.fix: "вынести в service; handler только маппит dto"
check.rest-02.when: "импорт sql/db в пакете handler"
check.rest-02.why: "транспорт ходит в хранилище напрямую"
check.rest-02.fix: "перенести доступ к данным в repo; из handler вызывать service"
check.rest-03.when: "http.Server без ReadHeaderTimeout или ReadTimeout"
check.rest-03.why: "возможны slowloris и зависшие соединения"
check.rest-03.fix: "задать read-таймауты на сервере"
check.rest-04.when: "post/upload маршрут без лимита размера тела"
check.rest-04.why: "большие тела запросов могут исчерпать память"
check.rest-04.fix: "MaxBytesReader или middleware с лимитом тела"
check.rest-05.when: "cors разрешает * origin с credentials"
check.rest-05.why: "браузер может открыть аутентифицированный cross-origin доступ"
check.rest-05.fix: "явный список разрешённых origin"
check.rest-06.when: "auth читает заголовок X-User-Id или X-Is-Admin"
check.rest-06.why: "клиент может подделать identity-заголовки"
check.rest-06.fix: "только jwt или session на стороне сервера"
