check.mongo-04.when: "нет Ping после mongo connect в cmd main"
check.mongo-04.why: "неверный uri может всплыть только на первом запросе"
check.mongo-04.fix: "ping с таймаутом при старте"
check.mongo-05.when: "mongo connect без опций размера pool"
check.mongo-05.why: "дефолтный pool может быть мал под нагрузкой"
