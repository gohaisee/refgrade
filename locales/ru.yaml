check.gw-01.when: "grpc-gateway mux без auth middleware"
check.gw-01.why: "http-мост может открыть rpc без grpc-side auth"
check.gw-01.fix: "тот же auth middleware на gateway-маршрутах"
check.gw-02.when: "gateway handler зарегистрирован до auth middleware"
check.gw-02.why: "неаутентифицированный трафик доходит до rpc раньше auth"
check.gw-02.fix: "регистрировать auth middleware до gateway handlers"
check.mongo-01.when: "mongo.Connect или NewClient внутри handler"
check.mongo-01.why: "клиент на запрос исчерпывает сокеты"
check.mongo-01.fix: "один общий mongo.Client на процесс"
check.mongo-02.when: "вызов mongo с context.Background на пути запроса"
check.mongo-02.why: "работа продолжается после отключения клиента"
check.mongo-02.fix: "передавать ctx запроса в вызовы collection"
check.mongo-03.when: "List*/FindAll* с Find без SetLimit"
check.mongo-03.why: "список может загрузить неограниченное число документов"
