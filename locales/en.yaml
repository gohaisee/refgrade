check.kafka-02.fix: "commit after successful processing"
check.kafka-03.when: "kafka message without key when ordering may matter"
check.kafka-03.why: "partition order is per key only"
check.kafka-03.fix: "set Message.Key by entity id when order matters"
check.rmq-01.when: "shared amqp channel across goroutines"
check.rmq-01.why: "amqp channels are not safe across goroutines"
check.rmq-01.fix: "one channel per consumer goroutine or mutex"
check.rmq-02.when: "queue declare without dead-letter exchange"
check.rmq-02.why: "poison messages block the queue"
check.rmq-02.fix: "configure x-dead-letter-exchange on critical queues"
check.rmq-03.when: "amqp dial without reconnect hints"
check.rmq-03.why: "connection drop stalls consumers"
check.rmq-03.fix: "wrap dial in reconnect loop with backoff"
check.nats-01.when: "core nats subscribe for critical work"
check.nats-01.why: "core nats can drop messages on disconnect"
check.nats-01.fix: "use jetstream with explicit ack"
check.nats-02.when: "jetstream consumer without ack handling"
check.nats-02.why: "unacked messages may be redelivered unpredictably"
