# keys must stay paired with ru.yaml
cli.usage: "scan a go module and print a refactor readiness report"
cli.lang_flag: "report language (en, ru)"
cli.format_flag: "output format (text, markdown, json, sarif)"
cli.output_flag: "write report to file instead of stdout"
cli.detect_usage: "detect stack libraries in a go module"
cli.scan_usage: "scan a go module for refactor readiness"
report.title: "refgrade scan report"
report.summary: "summary"
report.ok: "ok"
report.warn: "warn"
report.fail: "fail"
report.na: "n/a"
report.no_findings: "no findings"
report.check: "check"
report.severity: "severity"
report.file: "file"
report.line: "line"
report.when: "when"
report.why: "why"
report.fix: "fix"
report.module: "module"
report.findings: "findings"
report.check_status: "check status"
report.gaps: "out of scope for static scan: runtime IDOR/BOLA, DAST, K8s IAM — see docs/en/checks/security-owasp.md"
detect.title: "detected stack"
detect.none: "no known stack libraries detected"
check.cfg-01.when: "os.Getenv outside cmd/, tests, integration/e2e builds"
check.cfg-01.why: "env scattered in code; hard to test and rotate secrets"
check.cfg-01.fix: "load in internal/config; inject struct in main"
check.cfg-02.when: "more than 3 getenv calls without internal/config package"
check.cfg-02.why: "magic env key strings spread across packages"
check.cfg-02.fix: "add internal/config with struct and validation"
check.cfg-03.when: "hardcoded secret patterns in source"
check.cfg-03.why: "credentials leak via git history"
check.cfg-03.fix: "use env or secret manager; never commit values"
check.cfg-04.when: "jwt signing key set to empty string literal"
check.cfg-04.why: "auth can be bypassed with empty secret"
check.cfg-04.fix: "fail fast at startup when secret is missing"
check.lay-01.when: "application without cmd/<name>/main.go"
check.lay-01.why: "entrypoint is unclear for operators and tooling"
check.lay-01.fix: "move main under cmd/<app>/main.go"
check.lay-02.when: "business packages outside internal/ without pkg/ reason"
check.lay-02.why: "accidental public API surface"
check.lay-02.fix: "keep app code under internal/"
check.lay-03.when: "go.mod module path looks like a placeholder"
check.lay-03.why: "imports confuse consumers and forks"
check.lay-03.fix: "set module path to real VCS coordinates"
check.lyr-01.when: "service package imports db driver or ORM"
check.lyr-01.why: "business logic is tied to storage implementation"
check.lyr-01.fix: "use repo/store package; interface in service"
check.lyr-02.when: "handler imports internal/repo directly"
check.lyr-02.why: "transport layer knows SQL details"
check.lyr-02.fix: "call service only from handlers"
check.lyr-03.when: "New* or Init opens network or database"
check.lyr-03.why: "hidden side effects break unit tests"
check.lyr-03.fix: "wire connections in main only"
check.lyr-04.when: "package-level var db in service or handler"
check.lyr-04.why: "hidden global state and test races"
check.lyr-04.fix: "inject dependencies via struct fields"
check.err-01.when: "_ = err or empty if err != nil {}"
check.err-01.why: "error is dropped; failures stay invisible in prod"
check.err-01.fix: "return wrapped error, log, or handle explicitly"
check.err-02.when: "panic in internal/ outside main and tests"
check.err-02.why: "process crash on recoverable errors"
check.err-02.fix: "return error; recover at transport edge only"
check.err-03.when: "http.DefaultClient or http.Get/http.Post without custom client"
check.err-03.why: "no timeout; outbound call can hang forever"
check.err-03.fix: "use http.Client{Timeout: ...} and request context"
check.err-04.when: "http.Client with zero or missing Timeout"
check.err-04.why: "same hang risk as DefaultClient"
check.err-04.fix: "set Client.Timeout and transport deadlines"
check.err-05.when: "context.Background in handler instead of request context"
check.err-05.why: "work continues after client disconnect"
check.err-05.fix: "use r.Context() or stream context"
check.err-06.when: "go func inside for loop without worker limit"
check.err-06.why: "goroutine storm under load"
check.err-06.fix: "use semaphore or worker pool"
check.tst-01.when: "logic file without matching _test.go"
check.tst-01.why: "regressions go unnoticed"
check.tst-01.fix: "add table-driven test beside source"
check.tst-02.when: "single all_test.go covers whole package"
check.tst-02.why: "failures are hard to locate"
check.tst-02.fix: "split tests 1:1 with source files"
check.tst-03.when: "t.Skip without build tag in default CI path"
check.tst-03.why: "broken tests stay hidden"
check.tst-03.fix: "fix test or use //go:build integration"
check.obs-01.when: "fmt.Print* in internal/"
check.obs-01.why: "unstructured logs are lost in production"
check.obs-01.fix: "use slog, zap, or zerolog"
check.obs-02.when: "log arguments include password, token, or otp"
check.obs-02.why: "credentials leak into log storage"
check.obs-02.fix: "redact sensitive fields; log ids only"
check.con-01.when: "channel send in handler without backpressure policy"
check.con-01.why: "memory can grow under slow consumers"
check.con-01.fix: "bounded buffer and drop or block policy"
check.dead-01.when: "unreachable function reported by deadcode"
check.dead-01.why: "dead code increases maintenance cost"
check.dead-01.fix: "remove or wire function from entrypoints"
check.dead-06.when: "go mod tidy would change go.mod"
check.dead-06.why: "unused module dependencies bloat builds"
check.dead-06.fix: "run go mod tidy and commit result"
check.sec-16.when: "govulncheck reports known vulnerability"
check.sec-16.why: "dependency has published CVE"
check.sec-16.fix: "upgrade module to patched version"
explain.title: "check"
explain.when: "when"
explain.why: "why"
explain.fix: "fix"
explain.unknown: "unknown check"
check.gql-01.when: "sql/db driver imported in resolver package"
check.gql-01.why: "resolver talks to storage directly"
check.gql-01.fix: "delegate to service or repo layer"
check.gql-02.when: "db query inside for loop in resolver"
check.gql-02.why: "slow lists; query in a loop"
check.gql-02.fix: "dataloader, join in repo, or sql batch"
check.gql-03.when: "hand-edited generated.go or models_gen.go"
check.gql-03.why: "gqlgen regen overwrites manual edits"
check.gql-03.fix: "change schema and run gqlgen generate only"
check.gql-04.when: "no complexity or depth limit in server setup"
check.gql-04.why: "expensive query can overload the server"
check.gql-04.fix: "add gqlgen extension or custom middleware"
check.gql-05.when: "introspection enabled without env gate"
check.gql-05.why: "schema dump exposed in production"
check.gql-05.fix: "disable introspection or gate with auth"
check.gql-06.when: "graphiql or playground route without dev gate"
check.gql-06.why: "public schema UI in production"
check.gql-06.fix: "build tag or dev-only route"
check.gql-07.when: "map[string]interface{} in hand-written resolvers"
check.gql-07.why: "type safety lost on resolver boundary"
check.gql-07.fix: "use generated gqlgen models"
check.gql-08.when: "resolver file exceeds 500 lines"
check.gql-08.why: "large resolver file is hard to review"
check.gql-08.fix: "split by domain or thin delegates"
check.gql-09.when: "get-based graphql queries without size limit"
check.gql-09.why: "oversized urls and cache poisoning risk"
check.gql-09.fix: "post-only endpoint or limit query string"
check.gqlgen-01.when: "gqlgen.yml missing in gqlgen project"
check.gqlgen-01.why: "generate config is not pinned for ci"
check.gqlgen-01.fix: "add gqlgen.yml and pin generate in ci"
check.gqlgen-02.when: "federation entity resolver without auth on id"
check.gqlgen-02.why: "entity lookup may skip ownership check"
check.gqlgen-02.fix: "verify actor owns entity before return"
check.ggl-01.when: "no panic recovery at graphql execute boundary"
check.ggl-01.why: "resolver panic crashes the request path"
check.ggl-01.fix: "wrap executor with recover middleware"
check.ggl-02.when: "only legacy graphql-go/graphql dependency"
check.ggl-02.why: "code-first stack lacks gqlgen tooling"
check.ggl-02.fix: "consider gqlgen for new graphql work"
check.rest-01.when: "handler function over 80 lines without service calls"
check.rest-01.why: "business logic lives in transport layer"
check.rest-01.fix: "extract to service; handler maps dto only"
check.rest-02.when: "sql or db driver import in handler package"
check.rest-02.why: "transport layer reaches into storage"
check.rest-02.fix: "move data access to repo; call service from handler"
check.rest-03.when: "http.Server without ReadHeaderTimeout or ReadTimeout"
check.rest-03.why: "slowloris and hung connections are possible"
check.rest-03.fix: "set read timeouts on the server struct"
check.rest-04.when: "post or upload route without body size limit"
check.rest-04.why: "large request bodies can exhaust memory"
check.rest-04.fix: "use MaxBytesReader or middleware with a body limit"
check.rest-05.when: "cors allows wildcard origin with credentials"
check.rest-05.why: "browsers may expose authenticated cross-origin access"
check.rest-05.fix: "list explicit allowed origins"
check.rest-06.when: "auth reads X-User-Id or X-Is-Admin header"
check.rest-06.why: "clients can forge identity headers"
check.rest-06.fix: "validate jwt or session server-side only"
check.rest-07.when: "internal error text in json response body"
check.rest-07.why: "error details leak to clients"
check.rest-07.fix: "return safe codes; log details server-side"
check.rest-08.when: "gin.SetMode(DebugMode) outside dev build"
check.rest-08.why: "debug mode can expose stack traces to clients"
check.rest-08.fix: "set release mode from env in production"
check.rest-09.when: "gorilla/mux in go.mod without migration note"
check.rest-09.why: "gorilla/mux is unmaintained for new services"
check.rest-09.fix: "migrate to chi or stdlib 1.22+ routes"
check.rest-10.when: "http server setup without recover middleware"
check.rest-10.why: "handler panic can crash the process"
check.rest-10.fix: "add recover middleware at the outer edge"
check.sql-01.when: "Query/Exec/orm call inside for loop"
check.sql-01.why: "query in a loop on lists loads rows one at a time"
check.sql-01.fix: "batch with WHERE id = ANY($1) or join"
check.sql-02.when: "sql built with fmt.Sprintf and user input"
check.sql-02.why: "string-built sql allows injection"
check.sql-02.fix: "use parameterized queries only"
check.sql-03.when: "List*/FindAll* function without LIMIT in sql"
check.sql-03.why: "list call can scan the whole table"
check.sql-03.fix: "add hard LIMIT; use keyset pagination"
check.sql-04.when: "SELECT * in sql string"
check.sql-04.why: "over-fetchs columns the caller does not need"
check.sql-04.fix: "list columns explicitly"
check.sql-05.when: "new pool or connection inside handler"
check.sql-05.why: "per-request pools exhaust file descriptors"
check.sql-05.fix: "use one shared pool per process"
check.sql-06.when: "float64 field named for money"
check.sql-06.why: "float rounding breaks money math"
check.sql-06.fix: "use integer minor units or decimal type"
check.sql-07.when: "OFFSET in sql string or comment"
check.sql-07.why: "offset pages get slower on large tables"
check.sql-07.fix: "use keyset pagination (WHERE id > $cursor)"
check.pgx-01.when: "pgx.Connect in application code"
check.pgx-01.why: "single connection cannot serve concurrent requests"
check.pgx-01.fix: "use pgxpool.New for a shared pool"
check.pgx-02.when: "postgres error compared by string"
check.pgx-02.why: "message text changes between server versions"
check.pgx-02.fix: "use pgconn.PgError SQLSTATE codes"
check.pgx-03.when: "sslmode=disable in remote dsn"
check.pgx-03.why: "credentials travel in plaintext over the network"
check.pgx-03.fix: "enable tls for remote hosts"
check.gorm-01.when: "db.Raw with string concatenation"
check.gorm-01.why: "concatenated sql allows injection"
check.gorm-01.fix: "bind parameters with ? placeholders"
check.gorm-02.when: "deep Preload chain on list endpoint"
check.gorm-02.why: "nested preloads issue many queries per row"
check.gorm-02.fix: "use join or batch load"
check.gorm-03.when: "AutoMigrate in cmd main"
check.gorm-03.why: "schema drift in prod should use versioned migrations"
check.gorm-03.fix: "use goose or golang-migrate"
check.gorm-04.when: "Debug() outside tests"
check.gorm-04.why: "debug mode logs every sql statement"
check.gorm-04.fix: "remove Debug() from production paths"
check.gorm-05.when: "package-level var DB *gorm.DB"
check.gorm-05.why: "global db hides dependencies and races tests"
check.gorm-05.fix: "inject *gorm.DB via constructor"
check.sqlx-01.when: "sqlx Get/Select without context form"
check.sqlx-01.why: "call cannot be cancelled when client disconnects"
check.sqlx-01.fix: "use GetContext/SelectContext with request ctx"
check.sqlc-01.when: "hand-edited *.sql.go file"
check.sqlc-01.why: "manual edits are lost on next sqlc generate"
check.sqlc-01.fix: "change queries.sql and regenerate"
check.ent-01.when: "edge traversal inside for loop"
check.ent-01.why: "lazy edges trigger a query per iteration"
check.ent-01.fix: "eager-load edges or batch query"
check.grpc-01.when: "grpc.Dial or insecure credentials outside tests"
check.grpc-01.why: "traffic can be intercepted on the wire"
check.grpc-01.fix: "use tls or credentials.NewClientTLSFromCert"
check.grpc-02.when: "grpc.NewServer without unary or stream interceptors"
check.grpc-02.why: "no shared auth, logging, or recovery at the rpc edge"
check.grpc-02.fix: "chain unary and stream interceptors on the server"
check.grpc-03.when: "rpc handler over 50 lines with inline sql"
check.grpc-03.why: "business and storage logic live in the transport layer"
check.grpc-03.fix: "move sql to service or repo; keep handler thin"
check.grpc-04.when: "metadata x-user-id trusted for authorization"
check.grpc-04.why: "clients can forge metadata without a validated token"
check.grpc-04.fix: "validate jwt and map identity from signed claims"
check.grpc-05.when: "grpc reflection on the public listener"
check.grpc-05.why: "rpc surface is exposed to unauthenticated callers"
check.grpc-05.fix: "enable reflection on admin or dev port only"
check.grpc-06.when: "grpc server shutdown without GracefulStop"
check.grpc-06.why: "in-flight rpcs may be cut off on deploy"
check.grpc-06.fix: "handle signals and call GracefulStop before exit"
check.conn-01.when: "connect client created without timeout option"
check.conn-01.why: "outbound rpc can hang without a deadline"
check.conn-01.fix: "set connect.WithTimeout or client transport deadlines"
check.conn-02.when: "connect handler without interceptors"
check.conn-02.why: "same cross-cutting gaps as grpc.NewServer without middleware"
check.conn-02.fix: "add connect.WithInterceptors on handlers or mux"
check.gw-01.when: "grpc-gateway mux without auth middleware"
check.gw-01.why: "http bridge may expose rpc without grpc-side auth"
check.gw-01.fix: "apply the same auth middleware on gateway routes"
check.gw-02.when: "gateway handler registered before auth middleware"
check.gw-02.why: "unauthenticated traffic reaches rpc before auth runs"
check.gw-02.fix: "register auth middleware before gateway handlers"
check.mongo-01.when: "mongo.Connect or NewClient inside handler"
check.mongo-01.why: "per-request clients exhaust sockets"
check.mongo-01.fix: "one shared mongo.Client per process"
check.mongo-02.when: "mongo call with context.Background on request path"
check.mongo-02.why: "work keeps running after client disconnect"
check.mongo-02.fix: "pass request context into collection calls"
check.mongo-03.when: "List*/FindAll* with Find and no SetLimit"
check.mongo-03.why: "list query can load unbounded documents"
check.mongo-03.fix: "set limit on find options"
check.mongo-04.when: "no Ping after mongo connect in cmd main"
check.mongo-04.why: "bad uri may surface only at first request"
check.mongo-04.fix: "ping with timeout during startup"
check.mongo-05.when: "mongo connect without pool size options"
check.mongo-05.why: "default pool may be too small under load"
check.mongo-05.fix: "set SetMaxPoolSize and SetMinPoolSize"
check.mongo-06.when: "$where filter built from variables"
check.mongo-06.why: "javascript filters allow injection"
check.mongo-06.fix: "use typed query operators instead of $where"
check.mongo-07.when: "user $regex without regexp.QuoteMeta"
check.mongo-07.why: "crafted patterns can stall the server"
check.mongo-07.fix: "escape user input before $regex"
check.mongo-08.when: "bson import in handler package"
check.mongo-08.why: "document mapping belongs in repository layer"
check.mongo-08.fix: "move bson types to repository package"
