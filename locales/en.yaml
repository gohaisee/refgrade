check.cfg-01.when: "os.Getenv outside cmd/, tests, integration/e2e builds"
check.cfg-01.why: "env scattered in code; hard to test and rotate secrets"
check.cfg-01.fix: "load in internal/config; inject struct in main"
check.cfg-02.when: "more than 3 getenv calls without internal/config package"
check.cfg-02.why: "magic env key strings spread across packages"
check.cfg-02.fix: "add internal/config with struct and validation"
check.cfg-03.when: "hardcoded secret patterns in source"
check.cfg-03.why: "credentials leak via git history"
check.cfg-03.fix: "use env or secret manager; never commit values"
check.cfg-04.when: "jwt signing key set to empty string literal"
check.cfg-04.why: "auth can be bypassed with empty secret"
check.cfg-04.fix: "fail fast at startup when secret is missing"
check.lay-01.when: "application without cmd/<name>/main.go"
check.lay-01.why: "entrypoint is unclear for operators and tooling"
check.lay-01.fix: "move main under cmd/<app>/main.go"
check.lay-02.when: "business packages outside internal/ without pkg/ reason"
check.lay-02.why: "accidental public API surface"
check.lay-02.fix: "keep app code under internal/"
check.lay-03.when: "go.mod module path looks like a placeholder"
check.lay-03.why: "imports confuse consumers and forks"
check.lay-03.fix: "set module path to real VCS coordinates"
check.lyr-01.when: "service package imports db driver or ORM"
check.lyr-01.why: "business logic is tied to storage implementation"
check.lyr-01.fix: "use repo/store package; interface in service"
check.lyr-02.when: "handler imports internal/repo directly"
check.lyr-02.why: "transport layer knows SQL details"
check.lyr-02.fix: "call service only from handlers"
check.lyr-03.when: "New* or Init opens network or database"
check.lyr-03.why: "hidden side effects break unit tests"
check.lyr-03.fix: "wire connections in main only"
check.lyr-04.when: "package-level var db in service or handler"
check.lyr-04.why: "hidden global state and test races"
check.lyr-04.fix: "inject dependencies via struct fields"
check.err-01.when: "_ = err or empty if err != nil {}"
check.err-01.why: "error is dropped; failures stay invisible in prod"
check.err-01.fix: "return wrapped error, log, or handle explicitly"
check.err-02.when: "panic in internal/ outside main and tests"
check.err-02.why: "process crash on recoverable errors"
check.err-02.fix: "return error; recover at transport edge only"
check.err-03.when: "http.DefaultClient or http.Get/http.Post without custom client"
check.err-03.why: "no timeout; outbound call can hang forever"
check.err-03.fix: "use http.Client{Timeout: ...} and request context"
check.err-04.when: "http.Client with zero or missing Timeout"
check.err-04.why: "same hang risk as DefaultClient"
check.err-04.fix: "set Client.Timeout and transport deadlines"
check.err-05.when: "context.Background in handler instead of request context"
check.err-05.why: "work continues after client disconnect"
check.err-05.fix: "use r.Context() or stream context"
check.err-06.when: "go func inside for loop without worker limit"
check.err-06.why: "goroutine storm under load"
check.err-06.fix: "use semaphore or worker pool"
check.tst-01.when: "logic file without matching _test.go"
check.tst-01.why: "regressions go unnoticed"
check.tst-01.fix: "add table-driven test beside source"
check.tst-02.when: "single all_test.go covers whole package"
check.tst-02.why: "failures are hard to locate"
check.tst-02.fix: "split tests 1:1 with source files"
check.tst-03.when: "t.Skip without build tag in default CI path"
check.tst-03.why: "broken tests stay hidden"
check.tst-03.fix: "fix test or use //go:build integration"
check.obs-01.when: "fmt.Print* in internal/"
check.obs-01.why: "unstructured logs are lost in production"
check.obs-01.fix: "use slog, zap, or zerolog"
check.obs-02.when: "log arguments include password, token, or otp"
check.obs-02.why: "credentials leak into log storage"
check.obs-02.fix: "redact sensitive fields; log ids only"
check.con-01.when: "channel send in handler without backpressure policy"
check.con-01.why: "memory can grow under slow consumers"
check.con-01.fix: "bounded buffer and drop or block policy"
check.dead-01.when: "unreachable function reported by deadcode"
check.dead-01.why: "dead code increases maintenance cost"
check.dead-01.fix: "remove or wire function from entrypoints"
check.dead-06.when: "go mod tidy would change go.mod"
check.dead-06.why: "unused module dependencies bloat builds"
check.dead-06.fix: "run go mod tidy and commit result"
check.dead-02.when: "exported unreachable symbol in internal/"
check.dead-02.why: "dead exported api confuses consumers"
check.dead-02.fix: "remove or unexport unused symbol"
check.dead-03.when: "staticcheck U1000 unused func type or const"
check.dead-03.why: "unused code increases maintenance cost"
check.dead-03.fix: "remove or reference the symbol"
check.dead-04.when: "blank import with no side-effect comment"
check.dead-04.why: "blank import may be accidental leftover"
check.dead-04.fix: "remove import or document side effect"
check.dead-05.when: "init function only for debug logging"
check.dead-05.why: "init side effects complicate testing"
check.dead-05.fix: "move setup to explicit startup"
check.dead-07.when: "test helper func never referenced"
check.dead-07.why: "stale helpers clutter test packages"
check.dead-07.fix: "delete helper or use in tests"
check.dead-08.when: "build tag file with no matching build"
check.dead-08.why: "orphan file never compiles in any build"
check.dead-08.fix: "remove file or fix build tags"
check.sec-16.when: "govulncheck reports known vulnerability"
check.sec-16.why: "dependency has published CVE"
check.sec-16.fix: "upgrade module to patched version"
check.sec-01.when: "md5 or sha1 used for password hashing"
check.sec-01.why: "weak hash is fast to brute-force"
check.sec-01.fix: "use bcrypt, argon2, or scrypt"
check.sec-02.when: "tls.Config sets InsecureSkipVerify true"
check.sec-02.why: "man-in-the-middle can read or alter traffic"
check.sec-02.fix: "verify server certificates with a proper ca"
check.sec-03.when: "math/rand used for token or session id"
check.sec-03.why: "predictable values weaken auth"
check.sec-03.fix: "use crypto/rand for secrets"
check.sec-04.when: "jwt parsed without pinning algorithm"
check.sec-04.why: "attacker may swap signing method"
check.sec-04.fix: "validate token method in parse callback"
check.sec-05.when: "jwt SigningMethodNone referenced"
check.sec-05.why: "unsigned tokens bypass integrity"
check.sec-05.fix: "reject alg none explicitly"
check.sec-07.when: "os/exec with user-controlled arguments"
check.sec-07.why: "remote command execution risk"
check.sec-07.fix: "allowlist commands; never pass raw user input"
check.sec-08.when: "template.HTML wraps non-constant input"
check.sec-08.why: "html injection bypasses auto-escape"
check.sec-08.fix: "sanitize input or use text template"
check.sec-09.when: "http client calls url from variable input"
check.sec-09.why: "server-side request forgery to internal hosts"
check.sec-09.fix: "validate url; block private ip ranges"
check.sec-10.when: ".env file exists and is not gitignored"
check.sec-10.why: "secrets may be committed to git"
check.sec-10.fix: "add .env to gitignore; rotate leaked secrets"
check.sec-15.when: "net/http/pprof imported outside dev build"
check.sec-15.why: "profiling endpoints expose runtime internals"
check.sec-15.fix: "gate pprof behind dev build tag"
check.sec-r01.when: "handler reads path id without authz check"
check.sec-r01.why: "actor may access another user's resource"
check.sec-r01.fix: "verify ownership before load by id"
check.sec-r03.when: "json.Unmarshal into db model from request"
check.sec-r03.why: "mass assignment of privileged fields"
check.sec-r03.fix: "bind dto with explicit allowed fields"
check.sec-r04.when: "login route without rate limit middleware"
check.sec-r04.why: "brute-force on credentials is easier"
check.sec-r04.fix: "add rate limiter on auth routes"
check.sec-r05.when: "admin route without role middleware"
check.sec-r05.why: "privileged actions without rbac"
check.sec-r05.fix: "require admin role on admin paths"
check.sec-r06.when: "payment or otp flow without step-up auth"
check.sec-r06.why: "sensitive action without second factor"
check.sec-r06.fix: "require mfa or step-up before payout"
check.sec-r09.when: "http.Handle registered outside cmd setup"
check.sec-r09.why: "shadow route may miss auth middleware"
check.sec-r09.fix: "register routes only in central router"
check.sec-r10.when: "webhook handler without signature verify"
check.sec-r10.why: "forged webhook events may be accepted"
check.sec-r10.fix: "verify hmac signature and replay id"
check.sec-g04.when: "resolver loads node by id without authz"
check.sec-g04.why: "graphql node lookup may skip ownership"
check.sec-g04.fix: "check actor owns entity before return"
check.sec-g05.when: "graphql server without alias batch limit"
check.sec-g05.why: "alias batching can amplify query cost"
check.sec-g05.fix: "set max aliases or cost extension"
check.sec-g06.when: "cookie session auth with get graphql query"
check.sec-g06.why: "csrf against cookie-authenticated reads"
check.sec-g06.fix: "use post-only or csrf token"
check.sec-db05.when: "sql uses dynamic table or column name"
check.sec-db05.why: "user input in identifiers enables injection"
check.sec-db05.fix: "allowlist table and column names"
explain.title: "check"
explain.when: "when"
explain.why: "why"
explain.fix: "fix"
explain.unknown: "unknown check"
