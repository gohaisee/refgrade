name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum
      - name: Install scan tools
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Test
        run: go test ./... -race
        env:
          PATH: ${{ github.workspace }}/bin:${{ env.GOPATH }}/bin:${{ env.PATH }}
      - name: Coverage gate (internal/check)
        run: |
          go test ./internal/check/... -coverprofile=coverage.out
          pct=$(go tool cover -func=coverage.out | awk '/total:/ { sub(/%/,"",$3); print $3 }')
          echo "internal/check coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 75) { printf "coverage below 75%%: %s\n", p; exit 1 } }'
